[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-planner"
version = "0.1.0"
description = "Auditable simulator-corrected Markov kernels and planar route repair"
requires-python = ">=3.11,<3.14"
dependencies = [
  "jax==0.6.2",
  "jaxlib==0.6.2",
  "flax==0.10.6",
  "optax==0.2.5",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "matplotlib==3.10.3",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.0", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.29.5"]

[project.scripts]
ai-planner = "ai_planner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_planner"]
